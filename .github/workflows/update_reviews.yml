name: Actualizar Reseñas Automáticas

on:
  schedule:
    - cron: '0 0 * * 0' # Se ejecuta cada domingo automáticamente
  workflow_dispatch:     # Permite ejecutarlo a mano desde el botón 'Run workflow'

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar requests
        run: pip install requests

      - name: Extraer opiniones
        run: python sync_reviews.py

      - name: Subir cambios al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          git commit -m "Auto: Sincronizar opiniones de Google Maps" || exit 0
          git push
