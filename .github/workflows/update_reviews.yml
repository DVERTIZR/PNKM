name: Actualizar Reseñas con Python Playwright

on:
  schedule:
    - cron: '0 0 * * 0' # Corre solo cada domingo
  workflow_dispatch:     # Permite ejecutarlo a mano desde el botón 'Run workflow'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y Playwright
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Ejecutar script de extracción
        run: python sync_reviews.py

      - name: Guardar y commitear reviews.json en Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          git commit -m "Auto: Actualizar reviews.json desde Google Maps" || exit 0
          git push
